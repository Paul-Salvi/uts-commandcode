<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Tool calls — Command Code Monitor</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="logo">⚙</span>
      <h1>Tool calls</h1>
    </div>
    <nav class="topnav">
      <a class="btn-ghost" href="/">← Dashboard</a>
    </nav>
  </header>
  <main>
    <section class="metric-summary" id="summary"></section>
    <section class="metric-card">
      <h2 class="metric-title">Calls by tool</h2>
      <table class="metric-table" id="byTool"><tbody></tbody></table>
    </section>
    <section class="metric-card">
      <h2 class="metric-title">Calls by session</h2>
      <table class="metric-table" id="bySession"><tbody></tbody></table>
    </section>
  </main>
  <script src="/metrics/tools.js"></script>
</body>
</html>
